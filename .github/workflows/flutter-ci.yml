name: Dep-Stream - Compilar APK de depuración

# Dep-Stream — Etapa 1: Fundación.
#
# El CI solo verifica y compila. No escribe en el repositorio:
# permissions contents: read.
# Dispara en push y pull_request a main y etapa-0, y manualmente.
#
# FIRMA ESTABLE: antes del build se restaura el keystore debug dedicado
# desde el secreto DEPSTREAM_DEBUG_KEYSTORE_BASE64 y se exportan sus
# credenciales (DEPSTREAM_DEBUG_KEYSTORE_PASSWORD,
# DEPSTREAM_DEBUG_KEY_ALIAS, DEPSTREAM_DEBUG_KEY_PASSWORD) para que
# Gradle firme con esa clave en lugar de generar una nueva en cada run.
# Así todos los APK debug usan LA MISMA firma y se instalan como
# actualización, sin desinstalar. Si un secreto falta, el paso falla con
# mensaje claro. Después del build se imprime la huella SHA-256 del
# certificado del APK con apksigner para verificar la firma.
#
# NOTA: android/gradlew, android/gradlew.bat y android/gradle/wrapper/
# gradle-wrapper.jar NO están en el repositorio: android/.gitignore los
# excluye (es el .gitignore estándar de Flutter). Por eso las pruebas
# Kotlin con ./gradlew VAN DESPUÉS de "flutter build apk --debug": ese
# paso regenera el wrapper antes de invocarlo. No mover los pasos de
# ./gradlew antes del build, porque en un checkout limpio no existe
# ./gradlew.
#
# ESTE ARCHIVO NO SE PUEDE CREAR POR API (da 403). Félix lo crea desde
# la web de GitHub en la ruta .github/workflows/flutter-ci.yml con este
# contenido exacto.

on:
  push:
    branches: [main, etapa-0, etapa-1]
  pull_request:
    branches: [main, etapa-0, etapa-1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Instalar SQLite del sistema (para las pruebas de la base de datos)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libsqlite3-dev

      - name: Versión de Flutter
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test --reporter expanded

      - name: Restaurar keystore de firma estable
        run: |
          if [ -z "${{ secrets.DEPSTREAM_DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: falta el secreto DEPSTREAM_DEBUG_KEYSTORE_BASE64" >&2
            exit 1
          fi
          if [ -z "${{ secrets.DEPSTREAM_DEBUG_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.DEPSTREAM_DEBUG_KEY_ALIAS }}" ] || [ -z "${{ secrets.DEPSTREAM_DEBUG_KEY_PASSWORD }}" ]; then
            echo "ERROR: falta uno de los secretos DEPSTREAM_DEBUG_KEYSTORE_PASSWORD, DEPSTREAM_DEBUG_KEY_ALIAS o DEPSTREAM_DEBUG_KEY_PASSWORD" >&2
            exit 1
          fi
          mkdir -p ~/.android
          echo "${{ secrets.DEPSTREAM_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore || { echo "ERROR: el keystore restaurado está vacío" >&2; exit 1; }
          {
            echo "DEPSTREAM_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore"
            echo "DEPSTREAM_DEBUG_KEYSTORE_PASSWORD=${{ secrets.DEPSTREAM_DEBUG_KEYSTORE_PASSWORD }}"
            echo "DEPSTREAM_DEBUG_KEY_ALIAS=${{ secrets.DEPSTREAM_DEBUG_KEY_ALIAS }}"
            echo "DEPSTREAM_DEBUG_KEY_PASSWORD=${{ secrets.DEPSTREAM_DEBUG_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
          echo "Keystore de firma estable restaurado en ~/.android/debug.keystore"

      - name: Compilar el APK de depuración
        run: flutter build apk --debug

      - name: Verificar firma del APK
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -n 1)
          echo "apksigner: $APKSIGNER"
          echo "aapt2: $AAPT2"
          "$APKSIGNER" verify --print-certs "$APK"
          "$AAPT2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)"

      - name: Pruebas unitarias Kotlin
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Guardar el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: depstream-debug-apk-etapa1
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
